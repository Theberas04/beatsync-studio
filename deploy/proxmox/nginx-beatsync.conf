# BeatSync Studio — nginx site
# Statisch bestand, geen templating nodig: server_name _ vangt elk IP/hostnaam.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Healthcheck voor de provisioning-script (werkt ook zonder certificaat).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Alles naar HTTPS: de app gebruikt getDisplayMedia (tabblad-audio delen) en
    # dat vereist een secure context. Zonder TLS weigert de browser die functie.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 in de listen-regel: werkt op nginx 1.22 (Debian 12) én 1.26 (Debian 13).
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    root /var/www/beatsync;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/ssl/beatsync/cert.pem;
    ssl_certificate_key /etc/ssl/beatsync/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # De app is één HTML-bestand; geen caching forceren tijdens ontwikkeling.
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/beatsync.access.log;
    error_log  /var/log/nginx/beatsync.error.log warn;
}
